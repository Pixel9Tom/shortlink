version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm 11 は公開から 24 時間未満の版を拒否する（minimumReleaseAge）ので、それより長く待ってから提案させる
    cooldown:
      default-days: 3
    groups:
      # マイナー・パッチ更新は 1 本の PR にまとめる。メジャー更新は個別の PR で確認する
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint が TS 7 に未対応のため 6.0 系に据え置く（SPEC.md §10）
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']
